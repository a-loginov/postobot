<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} · ПостоБот</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1220;
            --bg-card: #1a1e33;
            --bg-card-hover: #222741;
            --bg-input: #12162a;
            --border: #2a3150;
            --text: #e8ecf8;
            --text-muted: #8b93b8;
            --accent: #6366f1;
            --accent-hover: #4f52e0;
            --green: #22c55e;
            --yellow: #eab308;
            --blue: #3b82f6;
            --red: #ef4444;
            --purple: #a855f7;
            --radius: 14px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            font-size: 15px;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .brand-title {
            font-weight: 700;
            font-size: 16px;
            line-height: 1.2;
        }
        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: background .15s, color .15s;
        }
        .nav a:hover { background: var(--bg-card-hover); color: var(--text); }
        .nav a.active {
            background: var(--accent);
            color: #fff;
        }
        .nav-icon { font-size: 18px; width: 20px; text-align: center; }

        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: background .15s, color .15s;
        }
        .sidebar-footer a:hover { background: var(--bg-card-hover); color: var(--red); }

        /* ---------- Main content ---------- */
        .main {
            flex: 1;
            padding: 32px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ---------- Cards ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform .15s, background .15s;
        }
        .card:hover { background: var(--bg-card-hover); transform: translateY(-2px); }

        .card-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .card-value.green { color: var(--green); }
        .card-value.yellow { color: var(--yellow); }
        .card-value.blue { color: var(--blue); }
        .card-value.red { color: var(--red); }
        .card-value.purple { color: var(--purple); }
        .card-value.accent { color: var(--accent); }

        /* ---------- Status badges ---------- */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; }

        .badge-new { background: rgba(234, 179, 8, 0.15); color: var(--yellow); }
        .badge-new .badge-dot { background: var(--yellow); }
        .badge-in-progress { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
        .badge-in-progress .badge-dot { background: var(--blue); }
        .badge-completed { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .badge-completed .badge-dot { background: var(--green); }
        .badge-rejected { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .badge-rejected .badge-dot { background: var(--red); }

        /* ---------- Chart ---------- */
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 200px;
            padding: 16px;
            margin-top: 8px;
        }
        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            gap: 8px;
            min-width: 0;
        }
        .chart-bar {
            background: linear-gradient(to top, var(--accent), var(--purple));
            border-radius: 8px 8px 0 0;
            min-height: 4px;
            transition: height .3s;
            opacity: 0.9;
        }
        .chart-bar:hover { opacity: 1; }
        .chart-label {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }
        .chart-count {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* ---------- Table ---------- */
        .table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 14px 18px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: var(--bg-card-hover);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--bg-card-hover); }
        .table-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .table-link:hover { text-decoration: underline; }
        .muted { color: var(--text-muted); font-size: 13px; }

        /* ---------- Section title ---------- */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ---------- Filters ---------- */
        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter-tab {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: all .15s;
        }
        .filter-tab:hover { background: var(--bg-card-hover); color: var(--text); }
        .filter-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ---------- Empty state ---------- */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty h3 { color: var(--text); margin-bottom: 6px; font-size: 18px; }

        /* ---------- Detail ---------- */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            margin-top: 8px;
        }
        @media (max-width: 900px) {
            .detail-grid { grid-template-columns: 1fr; }
            .main { padding: 20px; }
            .sidebar { width: 200px; min-width: 200px; }
        }
        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; padding: 12px 16px; }
            .brand { border: none; margin: 0; padding: 0; }
            .nav { flex-direction: row; justify-content: center; }
            .nav a span.label, .sidebar-footer { display: none; }
        }

        .detail-info p {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .detail-info strong { color: var(--text); }
        .detail-reason {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .detail-sidebar .card { margin-bottom: 16px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: all .15s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
            justify-content: center;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-new { background: rgba(234,179,8,.12); color: var(--yellow); border-color: rgba(234,179,8,.3); }
        .btn-new:hover { background: rgba(234,179,8,.25); }
        .btn-progress { background: rgba(59,130,246,.12); color: var(--blue); border-color: rgba(59,130,246,.3); }
        .btn-progress:hover { background: rgba(59,130,246,.25); }
        .btn-completed { background: rgba(34,197,94,.12); color: var(--green); border-color: rgba(34,197,94,.3); }
        .btn-completed:hover { background: rgba(34,197,94,.25); }
        .btn-rejected { background: rgba(239,68,68,.12); color: var(--red); border-color: rgba(239,68,68,.3); }
        .btn-rejected:hover { background: rgba(239,68,68,.25); }

        .status-form { display: grid; gap: 10px; }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .meta-row:last-child { border-bottom: none; }
        .meta-key { color: var(--text-muted); font-size: 13px; }
        .meta-value { font-weight: 600; font-size: 14px; text-align: right; }
    </style>
</head>
<body>

    {% if active %}
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">ПБ</div>
            <div>
                <div class="brand-title">ПостоБот</div>
                <div class="brand-sub">Админ-панель</div>
            </div>
        </div>

        <nav class="nav">
            <a href="/admin/dashboard" class="{{ 'active' if active == 'dashboard' else '' }}">
                <span class="nav-icon">📊</span> <span class="label">Дашборд</span>
            </a>
            <a href="/admin/requests" class="{{ 'active' if active == 'requests' else '' }}">
                <span class="nav-icon">📋</span> <span class="label">Заявки</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/admin/logout">
                <span class="nav-icon">🚪</span> <span class="label">Выйти</span>
            </a>
        </div>
    </aside>
    {% endif %}

    <main class="main">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
