{% extends "base.html" %}

{% block content %}
<style>
    .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        width: 100%;
    }
    .login-card {
        background: var(--bg-card);
        backdrop-filter: blur(var(--blur));
        -webkit-backdrop-filter: blur(var(--blur));
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
    }
    .login-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--accent), #15803d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Fira Code', monospace;
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        margin: 0 auto 20px;
        box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
    }
    .login-card h1 {
        text-align: center;
        font-family: 'Fira Code', monospace;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .login-sub {
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 28px;
    }
    .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: var(--red);
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        margin-bottom: 16px;
        text-align: center;
    }
</style>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">ПБ</div>
        <h1>ПостоБот</h1>
        <div class="login-sub">Вход в админ-панель</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/login">
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-input" type="password" id="password" name="password"
                       placeholder="Введите пароль" autofocus autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
