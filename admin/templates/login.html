{% extends "base.html" %}

{% block content %}
<style>
    .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        width: 100%;
    }
    .login-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
    }
    .login-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--accent), var(--purple));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        color: #fff;
        margin: 0 auto 20px;
    }
    .login-card h1 {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 6px;
    }
    .login-sub {
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
    }
    .input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border .15s, box-shadow .15s;
    }
    .input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--red);
        padding: 11px 14px;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 16px;
        text-align: center;
    }
</style>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">ПБ</div>
        <h1>ПостоБот</h1>
        <div class="login-sub">Вход в админ-панель</div>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/login">
            <div class="form-group">
                <label for="password">Пароль</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="Введите пароль" autofocus autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
